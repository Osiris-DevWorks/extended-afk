name: Release

# Same flow as Smart Citizen: merging a version bump to main publishes it.
# On every push to main, VERSION.TXT is read; if no GitHub Release exists
# for vX.Y.Z yet, this builds the exe on Windows, creates and pushes the tag,
# publishes the Release with the exe attached and the CHANGELOG section as
# notes, then posts the Discord announcement. Pushes that don't bump the
# version find the release already exists and skip.
#
# The in-app updater finds the exe by its ExtendedAFK-vX.Y.Z.exe name, so
# the asset must keep that name.
#
# Pushing a vX.Y.Z tag by hand also works, and "Run workflow" with an
# existing tag rebuilds that release.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.3"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"; trigger=dispatch
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"; trigger=tag
          else
            tag="v$(tr -d '[:space:]' < VERSION.TXT)"; trigger=branch
          fi
          skip=false
          if [ "$trigger" = "branch" ] && gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish"
            skip=true
          fi
          echo "Trigger: $trigger | Tag: $tag | Skip: $skip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.resolve.outputs.skip == 'false'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.resolve.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Check version files match the tag
        if: steps.resolve.outputs.skip == 'false'
        run: python scripts/release_tools.py check "${{ steps.resolve.outputs.tag }}"

      - name: Build exe
        if: steps.resolve.outputs.skip == 'false'
        run: python -m PyInstaller extended-afk.spec --clean --noconfirm

      - name: Write release notes
        if: steps.resolve.outputs.skip == 'false'
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          python scripts/release_tools.py notes "$tag" > release-notes.md
          ls -l "dist/ExtendedAFK-$tag.exe"

      - name: Create and push tag
        if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.trigger == 'branch'
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag (auto-tagged on merge to main)"
          git push origin "$tag"

      - name: Publish GitHub Release
        if: steps.resolve.outputs.skip == 'false'
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: Extended AFK ${{ steps.resolve.outputs.tag }}
          body_path: release-notes.md
          files: dist/ExtendedAFK-${{ steps.resolve.outputs.tag }}.exe
          fail_on_unmatched_files: true

      - name: Post Discord announcement
        if: steps.resolve.outputs.skip == 'false' && env.DISCORD_RELEASE_WEBHOOK_URL != ''
        continue-on-error: true
        run: python scripts/discord_notify.py "${{ steps.resolve.outputs.tag }}" "${{ steps.publish.outputs.url }}"
